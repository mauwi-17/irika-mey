<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erica Mae Camintoy · Full-stack Developer & UI/UX Designer</title>
    <meta name="description" content="Portfolio of Erica Mae “Mauwey” Camintoy: full-stack developer and UI/UX designer building considerate, accessible interfaces." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Orbitron:wght@500;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply saved display settings before React loads, so the page never flashes the wrong theme.
      try {
        var r = document.documentElement;
        r.dataset.theme = localStorage.getItem('theme') || 'dark';
        if (localStorage.getItem('largeText') === '1') r.dataset.text = 'large';
        var m = localStorage.getItem('reducedMotion');
        if (m === '1' || (m === null && matchMedia('(prefers-reduced-motion: reduce)').matches)) r.dataset.motion = 'reduced';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
